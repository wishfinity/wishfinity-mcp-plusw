# Publish wishfinity-mcp-plusw to the official MCP Registry via GitHub Actions
# OIDC — triggered by Lee pushing the release tag (Lee 2026-11-14 ruling).
#
# SCOPE: the REGISTRY publish ONLY. The Cloudflare Worker deploy and
# `npm publish` stay MANUAL and Lee-run (PDR § THE MCP SERVER). This workflow
# assumes npm already has the version (it asserts it, below) — Lee runs
# `npm publish` BEFORE pushing the tag.
#
# Auth: GitHub OIDC (`mcp-publisher login github-oidc`). No secrets: ownership
# of io.github.wishfinity/* is proven by the workflow's OIDC token.
# Source: https://modelcontextprotocol.io/registry/github-actions.md (2026-11-14).
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"] # Lee pushes v1.3.0 (etc.) AFTER merging to main + npm publish

# Least privilege: OIDC for registry auth; read the checked-out tag. No write.
permissions:
  id-token: write
  contents: read

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    env:
      # Pin the publisher CLI; bump deliberately (see "invalid audience" in the
      # troubleshooting table of the source doc). Do not switch to releases/latest.
      MCP_PUBLISHER_VERSION: v1.8.1
      PKG_NAME: wishfinity-mcp-plusw
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      # GUARD 1 — the tag must match every in-repo version string the registry
      # will read. Stops a mis-tagged release from publishing the wrong version.
      - name: Assert tag == package.json == server.json versions
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(jq -r '.version' package.json)"
          SRV="$(jq -r '.version' server.json)"
          SRV_PKG="$(jq -r '.packages[0].version' server.json)"
          echo "tag=$TAG | package.json=$PKG | server.json=$SRV | server.json packages[0]=$SRV_PKG"
          [ "$TAG" = "$PKG" ]     || { echo "::error::tag v$TAG != package.json version $PKG"; exit 1; }
          [ "$TAG" = "$SRV" ]     || { echo "::error::tag v$TAG != server.json version $SRV"; exit 1; }
          [ "$TAG" = "$SRV_PKG" ] || { echo "::error::tag v$TAG != server.json packages[0].version $SRV_PKG"; exit 1; }

      # GUARD 2 — the npm package for this version must already be live. Lee
      # publishes npm manually BEFORE pushing the tag; if it is not there, the
      # registry entry would point at a package that does not exist yet.
      - name: Assert this version is already published on npm
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PUBLISHED="$(npm view "${PKG_NAME}@${TAG}" version 2>/dev/null || true)"
          echo "npm reports version '${PUBLISHED}' for ${PKG_NAME}@${TAG}"
          [ "$PUBLISHED" = "$TAG" ] || { echo "::error::${PKG_NAME}@${TAG} is NOT on npm yet — run 'npm publish' BEFORE pushing the tag"; exit 1; }

      - name: Install cosign (to verify the mcp-publisher release)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Download the pinned mcp-publisher and verify its Sigstore bundle before
      # running it (integrity: the "checksum if offered" the brief asks for).
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish

      # GUARD 3 — post-publish verification against the registry API: the new
      # version is latest, and the entry carries remotes + title + icon (the
      # fields the silent-drop incident of v1.2.4 taught us to assert, PDR #9).
      - name: Verify the registry entry
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          sleep 5
          resp="$(curl --fail --silent --show-error "https://registry.modelcontextprotocol.io/v0/servers?search=${PKG_NAME}&version=latest")"
          echo "$resp" | jq '.'
          # Find the entry for our server name at this version (tolerate either a
          # flat `.servers[]` shape or a nested `.servers[].server`).
          entry="$(echo "$resp" | jq -c --arg v "$TAG" '[.servers[] | (.server // .) | select(.version==$v)] | first // empty')"
          [ -n "$entry" ] || { echo "::error::v$TAG not returned as latest by the registry"; exit 1; }
          echo "$entry" | jq -e '(.remotes | length) > 0'        >/dev/null || { echo "::error::registry entry is missing remotes[]"; exit 1; }
          echo "$entry" | jq -e '.title | type == "string"'      >/dev/null || { echo "::error::registry entry is missing title"; exit 1; }
          echo "$entry" | jq -e '(.icons | length) > 0'          >/dev/null || { echo "::error::registry entry is missing icons[]"; exit 1; }
          echo "Registry entry for v$TAG verified: remotes + title + icon present."
