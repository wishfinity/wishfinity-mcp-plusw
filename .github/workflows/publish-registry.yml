# Publish wishfinity-mcp-plusw on a release tag — npm FIRST, then the MCP Registry.
# OIDC throughout, triggered by Lee pushing the release tag (v1.3.1+).
#
# SCOPE: this workflow publishes BOTH npm and the MCP registry, tokenlessly,
# via GitHub OIDC. The Cloudflare Worker deploy stays MANUAL and Lee-run
# (PDR § THE MCP SERVER) — the Worker is not touched here.
#
# ORDER + FAIL-CLOSED: job `publish-npm` runs first; `publish-registry` has
# `needs: publish-npm`, so if the npm publish fails the registry job never
# runs (the registry must never point at an npm version that was not published).
#
# Auth:
#   - npm: trusted publishing (OIDC). NO NODE_AUTH_TOKEN. Requires a one-time
#     Trusted Publisher configured for this package on npmjs.com by the npm
#     owner (Lee) — repo wishfinity/wishfinity-mcp-plusw + this workflow file.
#     See the G.17-01 release sheet / https://docs.npmjs.com/trusted-publishers.
#     Needs npm CLI >= 11.5.1 (Node 22 ships npm 10.x — pinned/upgraded below).
#   - registry: `mcp-publisher login github-oidc`. Ownership of
#     io.github.wishfinity/* proven by the workflow's OIDC token.
#     Source: https://modelcontextprotocol.io/registry/github-actions.md (2026-11-14).
name: Publish (npm + MCP Registry)

on:
  push:
    tags: ["v*"] # Lee pushes v1.3.1 (etc.) AFTER merging to main.

env:
  PKG_NAME: wishfinity-mcp-plusw
  # Pin the npm CLI to the OIDC/trusted-publishing floor (GA 2025-07-31).
  # Bump deliberately; do not float to @latest.
  NPM_VERSION: 11.5.1
  # Pin the MCP publisher CLI; bump deliberately (see "invalid audience" in the
  # troubleshooting table of the source doc). Do not switch to releases/latest.
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  # ===================================================================
  # JOB 1 — publish to npm via trusted publishing (OIDC, provenance).
  # ===================================================================
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for npm trusted publishing + provenance
      contents: read
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v5

      - name: Set up Node.js (with the npm registry for publish)
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Pin npm to the trusted-publishing floor (>= 11.5.1)
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          echo "npm is now $(npm --version)"

      # GUARD 1 — the tag must match every in-repo version string BEFORE we
      # publish. Stops a mis-tagged release from reaching npm.
      - name: Assert tag == package.json == server.json versions
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(jq -r '.version' package.json)"
          SRV="$(jq -r '.version' server.json)"
          SRV_PKG="$(jq -r '.packages[0].version' server.json)"
          echo "tag=$TAG | package.json=$PKG | server.json=$SRV | server.json packages[0]=$SRV_PKG"
          [ "$TAG" = "$PKG" ]     || { echo "::error::tag v$TAG != package.json version $PKG"; exit 1; }
          [ "$TAG" = "$SRV" ]     || { echo "::error::tag v$TAG != server.json version $SRV"; exit 1; }
          [ "$TAG" = "$SRV_PKG" ] || { echo "::error::tag v$TAG != server.json packages[0].version $SRV_PKG"; exit 1; }

      # The same gate Lee runs locally: clean install, build, harness, and the
      # rebuilt dist must equal the committed dist (PDR #3).
      - name: Clean install, build, and run the harness
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test
          test -z "$(git status --porcelain)" || { echo "::error::rebuilt dist/ differs from committed dist/"; git status --porcelain; exit 1; }

      # Trusted publishing: NO NODE_AUTH_TOKEN. npm >= 11.5.1 detects the OIDC
      # environment and publishes with provenance automatically; --provenance is
      # explicit for clarity. prepublishOnly re-runs tsc.
      - name: Publish to npm (trusted publishing, provenance)
        run: npm publish --provenance --access public

  # ===================================================================
  # JOB 2 — publish server.json to the MCP Registry (runs only if npm did).
  # ===================================================================
  publish-registry:
    needs: publish-npm # FAIL-CLOSED: skipped if the npm publish failed
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for the MCP registry
      contents: read
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      # GUARD 2 — confirm npm now serves this version (the publish-npm job just
      # made it). Guards against npm propagation lag before we register a link
      # to the package.
      - name: Assert this version is live on npm
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          for i in 1 2 3 4 5; do
            PUBLISHED="$(npm view "${PKG_NAME}@${TAG}" version 2>/dev/null || true)"
            [ "$PUBLISHED" = "$TAG" ] && break
            echo "npm not yet serving ${PKG_NAME}@${TAG} (attempt $i) — waiting"; sleep 5
          done
          echo "npm reports version '${PUBLISHED}' for ${PKG_NAME}@${TAG}"
          [ "$PUBLISHED" = "$TAG" ] || { echo "::error::${PKG_NAME}@${TAG} is NOT on npm"; exit 1; }

      - name: Install cosign (to verify the mcp-publisher release)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Download the pinned mcp-publisher and verify its Sigstore bundle before
      # running it.
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish

      # GUARD 3 — post-publish verification: the new version is latest, and the
      # entry carries remotes + title + icon (the fields the v1.2.4 silent-drop
      # taught us to assert, PDR #9).
      - name: Verify the registry entry
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          sleep 5
          resp="$(curl --fail --silent --show-error "https://registry.modelcontextprotocol.io/v0/servers?search=${PKG_NAME}&version=latest")"
          echo "$resp" | jq '.'
          entry="$(echo "$resp" | jq -c --arg v "$TAG" '[.servers[] | (.server // .) | select(.version==$v)] | first // empty')"
          [ -n "$entry" ] || { echo "::error::v$TAG not returned as latest by the registry"; exit 1; }
          echo "$entry" | jq -e '(.remotes | length) > 0'        >/dev/null || { echo "::error::registry entry is missing remotes[]"; exit 1; }
          echo "$entry" | jq -e '.title | type == "string"'      >/dev/null || { echo "::error::registry entry is missing title"; exit 1; }
          echo "$entry" | jq -e '(.icons | length) > 0'          >/dev/null || { echo "::error::registry entry is missing icons[]"; exit 1; }
          echo "Registry entry for v$TAG verified: remotes + title + icon present."
